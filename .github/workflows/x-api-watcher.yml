name: X API watcher

on:
  schedule:
    - cron: "43 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: x-api-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun ci

      - name: Refresh upstream snapshot
        run: bun run --cwd packages/xdk-effect specs:update

      - name: Detect upstream changes
        id: changes
        run: |
          if git diff --quiet -- packages/xdk-effect/specs/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the review branch
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: codex/x-api-update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git checkout -B "$BRANCH"
          git add packages/xdk-effect/specs
          git commit -m "chore: refresh X API snapshot"
          git push --force-with-lease origin "HEAD:$BRANCH"

      - name: Open or update the review pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: codex/x-api-update
        run: |
          number="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          body="The watcher found a change in the upstream X OpenAPI spec. This PR only refreshes the pinned spec and its revision/checksum. Review the diff and patches, run bun run generate followed by bun run release:validate, and commit the generated output before merging. GitHub does not automatically run PR workflows for changes pushed with GITHUB_TOKEN; push the reviewed changes with your own account to trigger CI. This workflow never merges or publishes."
          if [ -z "$number" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "chore: review X API snapshot update" --body "$body"
          else
            gh pr edit "$number" --body "$body"
          fi
